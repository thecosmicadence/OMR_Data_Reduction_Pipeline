version: '3.8'

services:
  omr-pipeline:
    build:
      context: .
      dockerfile: Dockerfile
    image: omr-pipeline:latest
    container_name: omr_pipeline

    # ── X11 display forwarding (Linux host) ─────────────────────────────────
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1        # fixes Qt rendering issues inside Docker

    volumes:
      # X11 socket — required for Tkinter/DS9 GUI
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      # Mount your FITS data directory here:
      #   Change the left side to the actual path on your machine.
      - ./data:/data:rw
      # Optional: persist pyraf cache between runs
      - pyraf_cache:/app/pyraf

    # host network is needed so pyds9 can talk to DS9 over XPA
    network_mode: host

    # Keep stdin open for interactive IRAF prompts if needed
    stdin_open: true
    tty: true

volumes:
  pyraf_cache:
